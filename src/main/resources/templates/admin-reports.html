<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Reports</title></head>
<body>
    <h2>Pickup Reports & History</h2>
    <p>Total: <span th:text="${total}"></span> |
       Completed: <span th:text="${completed}"></span> |
       Pending: <span th:text="${pending}"></span> |
       Assigned: <span th:text="${assigned}"></span></p>

    <table border="1">
        <tr><th>ID</th><th>User</th><th>Category</th><th>Address</th><th>Status</th><th>Date</th></tr>
        <tr th:each="req : ${requests}">
            <td th:text="${req.id}"></td>
            <td th:text="${req.user.name}"></td>
            <td th:text="${req.category}"></td>
            <td th:text="${req.address}"></td>
            <td th:text="${req.status}"></td>
            <td th:text="${req.createdAt}"></td>
        </tr>
    </table>
    <a href="/admin/requests">Back to Requests</a>
</body>
</html>
