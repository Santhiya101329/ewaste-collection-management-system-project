<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Register</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f4f8f4;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: #ffffff;
            padding: 40px 35px;
            border-radius: 12px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
            width: 100%;
            max-width: 380px;
        }

        h2 {
            text-align: center;
            color: #1b1b1b;
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 24px;
        }

        .error-msg {
            color: #c62828;
            background: #ffebee;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            text-align: center;
            margin-bottom: 15px;
        }

        form label,
        form .field-label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #4a4a4a;
            font-size: 13px;
        }

        .field {
            margin-bottom: 16px;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.15s, box-shadow 0.15s;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="password"]:focus {
            border-color: #43a047;
            box-shadow: 0 0 0 3px rgba(67, 160, 71, 0.12);
        }

        button[type="submit"] {
            width: 100%;
            padding: 12px;
            background-color: #2e7d32;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
        }

        button[type="submit"]:hover {
            background-color: #256428;
        }

        .login-link {
            display: block;
            text-align: center;
            margin-top: 18px;
            font-size: 13px;
            color: #6b6b6b;
        }

        .login-link a {
            color: #2e7d32;
            text-decoration: none;
            font-weight: 600;
        }

        .login-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>🌱 Create Account</h2>
    <p th:if="${error}" th:text="${error}" class="error-msg"></p>
    <form th:action="@{/register}" th:object="${user}" method="post">
        <div class="field">
            <span class="field-label">Name</span>
            <input type="text" th:field="*{name}" required/>
        </div>
        <div class="field">
            <span class="field-label">Email</span>
            <input type="email" th:field="*{email}" required/>
        </div>
        <div class="field">
            <span class="field-label">Phone</span>
            <input type="text" th:field="*{phone}"/>
        </div>
        <div class="field">
            <span class="field-label">Address</span>
            <input type="text" th:field="*{address}"/>
        </div>
        <div class="field">
            <span class="field-label">Password</span>
            <input type="password" th:field="*{password}" required/>
        </div>
        <button type="submit">Register</button>
    </form>
    <span class="login-link">
        Already have an account? <a th:href="@{/login}">Login</a>
    </span>
</div>
</body>
</html>
